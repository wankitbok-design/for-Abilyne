<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Abilyne - Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Card Wrapper Container -->
    <div class="card-container" id="birthdayCard">
        
        <!-- FRONT COVER OF THE CARD -->
        <div class="card-front">
            <div class="cover-design">
                <div class="heart-pulse">❤️</div>
                <h2>For Abilyne</h2>
                <p>A special gift made with love</p>
                <div class="tap-indicator">Tap Card to Open</div>
            </div>
        </div>

        <!-- INSIDE RIGHT PAGE -->
        <div class="card-inside">
            <div class="glow-overlay"></div>
            
            <!-- High performance canvas layer -->
            <canvas id="treeCanvas"></canvas>
            
            <div class="card-text">
                <h1>Happy Birthday, Abilyne! 😚</h1>
                <div class="card-divider"></div>
                <p class="message">
                    You mean the absolute universe to me. May your day be as beautiful, bright, and wonderful as your smile. Growing more in love with you every single day. ❤️
                </p>
                <span class="signature">Forever Yours, XOXO</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
