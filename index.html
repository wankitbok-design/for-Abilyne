<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Abilyne - Happy Birthday</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #12030e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card-perspective {
            position: relative;
            width: 350px;
            height: 580px;
        }

        .card-container {
            position: absolute;
            width: 100%;
            height: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
        }

        /* The cover setup as a functional layer */
        .card-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b0622 0%, #170312 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
            border: 2px solid #4a1238;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .cover-design {
            text-align: center;
            padding: 20px;
        }

        .heart-pulse {
            font-size: 60px;
            animation: pulse 1.8s infinite ease-in-out;
            margin-bottom: 20px;
        }

        .card-front h2 {
            color: #ff7ebb;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-front p {
            color: #a37fa1;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        /* Massive, explicit button layer to handle mobile taps flawlessly */
        .open-btn {
            background: linear-gradient(45deg, #ff1493, #ff6ebb);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
            cursor: pointer;
            z-index: 20;
        }

        .card-inside {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1f0518;
            z-index: 1;
            border-radius: 16px;
            border: 2px solid #54103e;
            overflow: hidden;
        }

        .glow-overlay {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.25) 0%, rgba(0,0,0,0) 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .card-text {
            position: relative;
            z-index: 5;
            padding: 45px 25px;
            text-align: center;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease;
        }

        .card-text h1 {
            font-size: 1.7rem;
            background: linear-gradient(45deg, #ff99dc, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .card-divider {
            width: 40px;
            height: 2px;
            background: rgba(255, 20, 147, 0.5);
            margin: 0 auto 20px auto;
            border-radius: 2px;
        }

        .card-text .message {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #f7e1ee;
            margin-bottom: 25px;
        }

        .signature {
            display: block;
            font-size: 1rem;
            color: #ff6ebb;
            font-style: italic;
        }

        /* STATE STYLINGS WHEN OPENED */
        .card-container.open-state .card-front {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .card-container.open-state .card-text {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,20,147,0.4)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 20px rgba(255,20,147,0.8)); }
        }
    </style>
</head>
<body>

    <div class="card-perspective">
        <div class="card-container" id="birthdayCard">
            
            <!-- Front Cover Layer -->
            <div class="card-front" id="frontCover">
                <div class="cover-design">
                    <div class="heart-pulse">❤️</div>
                    <h2>For Abilyne</h2>
                    <p>A special gift made with love</p>
                </div>
                <!-- Clean direct button interface for error-free mobile screen clicking -->
                <button class="open-btn" id="openCardBtn">Open Card</button>
            </div>

            <!-- Inside Presentation Layout -->
            <div class="card-inside">
                <div class="glow-overlay"></div>
                <canvas id="treeCanvas"></canvas>
                <div class="card-text">
                    <h1>Happy Birthday, Abilyne! 😚</h1>
                    <div class="card-divider"></div>
                    <p class="message">
                        You mean the absolute universe to me. May your day be as beautiful, bright, and wonderful as your smile. Growing more in love with you every single day. ❤️
                    </p>
                    <span class="signature">Forever Yours, XOXO</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardContainer = document.getElementById('birthdayCard');
            const openBtn = document.getElementById('openCardBtn');
            const canvas = document.getElementById('treeCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = 350;
            canvas.height = 580;

            let branchData = [];
            let heartPetals = [];
            let animationCounter = 0;
            let animId = null;

            function buildTreeStructure(startX, startY, length, angle, width, depth) {
                if (depth > 6) return;

                const rad = angle * Math.PI / 180;
                const endX = startX + length * Math.cos(rad);
                const endY = startY + length * Math.sin(rad);

                branchData.push({
                    startX, startY, endX, endY,
                    width, depth,
                    growthDelay: depth * 10
                });

                const nextLength = length * 0.75;
                const nextWidth = width * 0.7;

                buildTreeStructure(endX, endY, nextLength + Math.random()*10, angle - 22 - Math.random()*10, nextWidth, depth + 1);
                buildTreeStructure(endX, endY, nextLength + Math.random()*10, angle + 22 + Math.random()*10, nextWidth, depth + 1);
            }

            function initPetals() {
                heartPetals = [];
                for (let i = 0; i < 20; i++) {
                    let petal = {
                        x: Math.random() * canvas.width,
                        y: Math.random() * -canvas.height,
                        size: 3 + Math.random() * 4,
                        speedY: 1 + Math.random() * 1.5,
                        swing: Math.random() * 2,
                        swingSpeed: 0.02 + Math.random() * 0.02,
                        angle: Math.random() * 360
                    };
                    heartPetals.push(petal);
                }
            }

            function renderFrame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let itemsRemaining = false;
                animationCounter += 2;

                branchData.forEach(b => {
                    if (animationCounter > b.growthDelay) {
                        ctx.beginPath();
                        ctx.moveTo(b.startX, b.startY);

                        let timeDiff = animationCounter - b.growthDelay;
                        let progression = Math.min(1, timeDiff / 12);
                        
                        let currentX = b.startX + (b.endX - b.startX) * progression;
                        let currentY = b.startY + (b.endY - b.startY) * progression;

                        ctx.lineTo(currentX, currentY);
                        ctx.lineWidth = b.width;
                        
                        let opacity = 1 - (b.depth * 0.08);
                        ctx.strokeStyle = "rgba(110,24,73," + opacity + ")";
                        
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        if (progression < 1) itemsRemaining = true;

                        if (progression >= 1 && b.depth >= 4) {
                            let leafSize = 4 + (b.depth * 0.5);
                            drawHeartIcon(b.endX, b.endY, leafSize, '#ff1493', 4);
